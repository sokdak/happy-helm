apiVersion: v1
kind: Service
metadata:
  name: {{ include "happy.fullname" . }}
  labels:
    {{- include "happy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "happy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
      protocol: TCP
