apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "happy.fullname" . }}
  labels:
    {{- include "happy.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "happy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "happy.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.nodeArch }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [{{ .Values.nodeArch | quote }}]
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "happy.fullname" . }}-postgres -p 5432 -U {{ .Values.database.user }}; do echo "waiting for postgres..."; sleep 2; done
      {{- end }}
      containers:
        - name: happy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Apply Prisma migrations to Postgres, then serve (UI + relay). DB_PROVIDER=postgres makes
          # the server use DATABASE_URL (real Postgres) instead of embedded PGlite.
          command: ["sh", "-c"]
          args:
            - >-
              node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma &&
              exec tsx --tsconfig tsconfig.json sources/standalone.ts serve
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: DB_PROVIDER
              value: {{ .Values.database.provider | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.urlKey | quote }}
            - name: DATA_DIR
              value: "/data"
            - name: HAPPY_STATIC_DIR
              value: "/app/webapp"
            - name: HAPPY_INJECT_HTML_CONFIG
              value: {{ printf "{\"serverUrl\":\"%s\"}" .Values.server.serverUrl | quote }}
            - name: HANDY_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterSecret.existingSecret | quote }}
                  key: {{ .Values.masterSecret.key | quote }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
