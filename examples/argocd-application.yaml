# Example ArgoCD Application that deploys this chart via GitOps.
# Adjust namespace, host/serverUrl, postgres.storageClass, project, and the secrets for your cluster.
# Prereqs (create out-of-band, never commit):
#   kubectl -n happy create secret generic happy-secrets  --from-literal=HANDY_MASTER_SECRET=$(openssl rand -hex 32)
#   PW=$(openssl rand -hex 24); kubectl -n happy create secret generic happy-postgres \
#     --from-literal=password="$PW" \
#     --from-literal=database-url="postgresql://happy:${PW}@happy-postgres:5432/happy?schema=public"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: happy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: happy
  source:
    repoURL: https://github.com/sokdak/happy-helm.git
    targetRevision: main
    path: .
    helm:
      values: |
        image:
          tag: "2026.06.11"
        api:
          host: api.happy.example.com    # GET / -> "Welcome to Happy Server!" (native-app custom server)
        fe:
          host: happy.example.com        # web UI; serverUrl auto-derives to https://<api.host>
        postgres:
          storageClass: ""   # set e.g. ceph-block/longhorn to pin
        database:
          existingSecret: happy-postgres
        masterSecret:
          existingSecret: happy-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
